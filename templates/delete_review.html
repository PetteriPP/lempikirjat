{% extends "layout.html" %}

{% block title %}Poista arvostelu{% endblock %}

{% block content %}
<h2>Poista arvostelu</h2>
<p> Arvostelu: {{ review.title }} </p>
<p>Haluatko varmasti poistaa arvostelun?</p>
<form action="/delete_review/{{ review.id }}" method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
  <input type="submit" name="delete" value="Kyllä">
  <input type="submit" name="cancel" value="Ei">
</form>
{% endblock %}
