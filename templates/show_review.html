<!DOCTYPE html>
<html>

<head>
  <title>{{ item.title }}</title>
</head>

<body>
    {% if session.user_id == item.user_id %}
  <p>
    <a href="/edit_review/{{ item.id }}">Muokkaa</a>
    <a href="/">Takaisin</a>
  </p>
  {% endif %}
  <h1>Kirja: {{ item.title }}</h1>
  <h2>Kirjailija: {{ item.author }}</h2>
  <p></p>
  <h3>Arvostelu:</h3>
  <p>{{ item.description }}</p>
  <h4>Arvosana: {{ item.rating }}</h4>

  <p>Arvostelun kirjoittaja: {{ item.username }}</p>
</body>

</html>
