<!DOCTYPE html>
<html>

<head>
  <title>Muokkaa arvostelua</title>
</head>

<body>
  <h1>Muokkaa arvostelua</h1>
  <form action="/update_review" method="post">
    <p>
      Kirjan nimi: <br />
      <input type="text" name="book_name" value="{{ item.title}}"/>
    </p>
    <p>
        Kirjailijan nimi: <br /> 
        <input type="text" name="author_name" value="{{ item.author }}" />
    </p>
    <p>
      Arvostelu: <br />
      <textarea name = "description" rows="8" cols="25">{{ item.description }}</textarea>
    </p>
    <p>
      Arvosana 1-10: <br />
      <input type="number" name="rating" value="{{ item.rating }}" />
    </p>
    <input type="hidden" name="review_id" value="{{ item.id }}" />
    <input type="submit" value="Päivitä" />
    <button type="submit"
        formaction="/review/{{ item.id }}"
        formmethod="get">
  Peru
</button>
  </form>
</body>

</html>
