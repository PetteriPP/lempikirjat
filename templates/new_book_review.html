<!DOCTYPE html>
<html>

<head>
  <title>Uusi kirja-arvostelu</title>
</head>

<body>
  <h1>Luo uusi arvostelu</h1>
  <form action="/create_book_review" method="post">
    <p>
      Kirjan nimi: <br />
      <input type="text" name="book_name" />
    </p>
    <p>
        Kirjailijan nimi: <br /> 
        <input type="text" name="author_name" />
    </p>
    <p>
      Arvostelu: <br />
      <textarea name = "description" rows="8" cols="25"> </textarea>
    </p>
    <p>
      Arvosana 1-10: <br />
      <input type="number" name="rating" />
    </p>
    <input type="submit" value="Lähetä" />
  </form>
</body>

</html>
